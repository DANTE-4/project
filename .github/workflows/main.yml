name: Run FastAPI Backend

on:
  workflow_dispatch:

jobs:
  run-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run main.py
        env:
          PYTHONPATH: backend
          SECRET_KEY: "dummy-secret-key-for-ci-testing"
          POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/dbname"
        run: python backend/app/main.py
