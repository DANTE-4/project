version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chik_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chikungunya_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chik_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-chik_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_URL: "postgresql+asyncpg://${POSTGRES_USER:-chik_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-chikungunya_ai}"
      MONGODB_URL: "mongodb://${MONGO_USER:-chik_user}:${MONGO_PASSWORD:-changeme}@mongodb:27017"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/models:/app/app/models # persist trained model files

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  mongo_data:
